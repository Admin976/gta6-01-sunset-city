<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunset City</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d0a12; font-family: ui-monospace, Menlo, Consolas, monospace; color: #fff; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; text-shadow: 0 2px 6px rgba(0,0,0,.85); }
  #tl { position: absolute; left: 24px; top: 18px; }
  #clock { font-size: 30px; letter-spacing: 2px; color: #ffe6b8; }
  #district { font-size: 12px; letter-spacing: 5px; color: #ffb27a; text-transform: uppercase; margin-top: 2px; }
  #stars { position: absolute; right: 24px; top: 20px; font-size: 24px; color: #ffcf6a; letter-spacing: 3px; }
  #bars { position: absolute; left: 24px; bottom: 22px; width: 230px; }
  #hp { height: 10px; background: rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.25); margin-top: 6px; }
  #hp-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #63d47a, #b6e05a); transition: width .18s linear; }
  #money { margin-top: 10px; font-size: 26px; color: #b7f0a8; letter-spacing: 1px; }
  #speedo { position: absolute; right: 22px; bottom: 232px; text-align: right; }
  #speed { font-size: 34px; color: #ffe6b8; }
  #speedo small { display: block; font-size: 10px; letter-spacing: 3px; color: #ffb27a; }
  #minimap { position: absolute; right: 20px; bottom: 20px; width: 200px; height: 200px; border: 2px solid rgba(255,255,255,.18); background: #0b0912; border-radius: 4px; }
  #title { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center;
           background: radial-gradient(circle at 50% 42%, rgba(60,32,64,.94), rgba(13,10,18,.97) 72%); }
  #title.hidden { display: none; }
  #title h1 { margin: 0; font-size: 64px; letter-spacing: 12px; color: #ffd9a0; text-shadow: 0 0 34px rgba(255,122,61,.55); }
  #title .sub { color: #ff9a6a; letter-spacing: 6px; font-size: 12px; text-transform: uppercase; margin-bottom: 22px; }
  #title button { pointer-events: auto; cursor: pointer; font: inherit; font-size: 15px; letter-spacing: 4px; text-transform: uppercase;
                  padding: 12px 40px; color: #ffe6b8; background: rgba(255,255,255,.06); border: 1px solid rgba(255,212,160,.45); }
  #title button:hover { background: rgba(255,180,120,.18); }
  #controls { max-width: 460px; font-size: 12px; line-height: 1.9; color: #cfc3d8; text-align: left; margin-top: 10px; }
  #controls b { color: #ffd9a0; }
</style>
</head>
<body>
<canvas id="game" aria-label="Sunset City: an open-world crime sandbox in the fictional coastal city of Puerto Sol"></canvas>

<div id="hud">
  <div id="tl"><div id="clock">17:36</div><div id="district">Puerto Sol</div></div>
  <div id="stars">☆☆☆☆☆</div>
  <div id="bars">
    <div style="font-size:10px;letter-spacing:4px;color:#ffb27a">HEALTH</div>
    <div id="hp"><div id="hp-fill"></div></div>
    <div id="money">$0</div>
  </div>
  <div id="speedo"><span id="speed">0</span><small>KM/H</small></div>
  <canvas id="minimap" width="200" height="200" aria-label="City minimap"></canvas>
</div>

<div id="title">
  <h1>SUNSET CITY</h1>
  <div class="sub">Puerto Sol &mdash; the sun never quite sets on a bad idea</div>
  <button id="play">Play</button>
  <button id="controls-btn">Controls</button>
  <div id="controls" hidden>
    <b>W A S D</b> move &nbsp; <b>Shift</b> sprint &nbsp; <b>Space</b> jump<br>
    <b>Mouse drag / click</b> look around &nbsp; <b>Wheel</b> zoom<br>
    <b>Esc</b> release the mouse
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
